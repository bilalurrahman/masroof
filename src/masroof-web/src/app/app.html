<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/capture">
      <span class="logo">﷼</span>
      <span class="name">{{ i18n.t('app.title') }}</span>
      <span class="tag mono-label">LEDGER // AI</span>
    </a>

    <nav class="nav">
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-link mono-label">
          {{ i18n.t(item.key) }}
        </a>
      }
    </nav>

    <div class="actions">
      <button type="button" class="icon-btn mono-label" (click)="i18n.toggle()" [attr.aria-label]="i18n.t('common.language')">
        {{ i18n.t('common.language') }}
      </button>
      <button type="button" class="icon-btn" (click)="theme.toggle()" [attr.aria-label]="i18n.t('common.theme')">
        {{ theme.theme() === 'dark' ? '◐' : '◑' }}
      </button>
      @if (auth.authEnabled) {
        @if (auth.isAuthenticated()) {
          <span class="user mono-label" title="{{ auth.userName() }}">{{ auth.userName() || 'USER' }}</span>
          <button type="button" class="icon-btn mono-label" (click)="auth.logout()">{{ i18n.t('auth.logout') }}</button>
        } @else {
          <button type="button" class="icon-btn mono-label" (click)="auth.login()">{{ i18n.t('auth.login') }}</button>
        }
      }
    </div>
  </header>

  <main class="content grid-bg">
    <div class="page">
      <router-outlet />
    </div>
  </main>

  <footer class="statusbar mono-label">
    <span>MASROOF // PRIVATE AI EXPENSE LEDGER</span>
    <span>ON-PREM · ZERO EGRESS</span>
  </footer>

  <app-toast-host />
</div>
