services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8081:8080"]
    volumes: ["./realm-masroof.json:/opt/keycloak/data/import/realm.json"]

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Sql: "Server=sql;Database=Masroof;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Llm__Endpoint: "http://ollama:11434"
      Llm__ParseModel: "qwen3:8b"
      Llm__AskModel: "qwen3:8b"
      Llm__EmbedModel: "bge-m3"
      Auth__Authority: "http://keycloak:8080/realms/masroof"
      Auth__Audience: "masroof-api"
      Auth__RequireHttpsMetadata: "false"
      Database__AutoMigrate: "true"
      Cors__Origins__0: "http://localhost:4200"
    depends_on: [sql, ollama, keycloak]
    ports: ["8080:8080"]

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    environment:
      ConnectionStrings__Sql: "Server=sql;Database=Masroof;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Llm__Endpoint: "http://ollama:11434"
      Llm__EmbedModel: "bge-m3"
      Llm__ParseModel: "qwen3:8b"
    depends_on: [sql, ollama]

volumes:
  sqldata: {}
  ollama: {}
